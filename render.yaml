services:
  - type: web
    name: bloodline-connect
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        value: admin123
      - key: DEMO_DONOR_PASSWORD
        value: donor123
      - key: FLASK_DEBUG
        value: "0"
